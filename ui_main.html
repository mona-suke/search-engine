	$('form').on('submit', function(e){

	<script>
		const tagcontainer = document.getElementById('selected_tags');
		// 既存: species_id をセット
		function get_species_id(event) {
			const target = event.target;
			const ganre_name = $('#genre_name').val();
			if (target.tagName === 'LI') {
				const speciesID = target.getAttribute('data-id');
				const table_name = target.getAttribute('class');
				//document.getElementById('output').textContent = speciesID + ' : ' + target.textContent +'(' + table_name + ')';
				document.getElementById('species_id').value = speciesID;
				document.getElementById('table_name').value = table_name;
				//$(".species_name").html('<tr><td>' + ganre_name + '―' + target.textContent + '</td></tr>');
				
				//タグの存在確認
				if(document.querySelector(`#selected_tags span[data-id="${speciesID}"]`)) return;
				
				const tag = document.createElement('span');
				tag.className = 'tag';
				tag.setAttribute('data-id', speciesID); // 作ったタグにdata-id属性を持たせる（品種idの番号ふる）
				tag.innerHTML = `<button type="button" class="remove-tag">×|</button>${target.textContent}`;
				tagcontainer.appendChild(tag);
				
				const trg_species = document.querySelectorAll('#selected_tags span');
				const species_lists = Array.from(trg_species).map((x) => x.dataset.id);

				//最新データを数行取得して結果に描画
				fetchtabledata(14,species_lists);
			}
		}
		tagcontainer.addEventListener('click',(e) =>{
			if(e.target.classList.contains('remove-tag')){
				e.target.parentElement.remove();
			}
		});
	</script>

	<script>
		// mysqlからデータ取得後、表として表示
		function fetchtabledata(num_limit = null,species_lists = null){
			// species_lists が指定されなければ []
			if(!species_lists) species_lists = [];

			const genre   = $('#table_name').val();
			//select multipleはval()で複数選択もとれる
			const regions = $('.js-multiple').val() || [];
			const start   = $('input[name="start_date"]').val();
			const end     = $('input[name="end_date"]').val();

			$(".result_table").html("<p>読み込み中...</p>");
			
			$.ajax({
				url: 'mock_data.php',
				type: 'POST',
				dataType: 'json',
				data: {
					table: genre,
					species_list: species_lists,
					regions_list: regions,
					start_date: start,
					end_date: end,
					limit: num_limit
				}
			}).done(function(response){

				let html = '';
				let species
				let columns
				let data
				switch(response.mode){
					case 'normal':
						//const container = document.getElementById('table-container');
						species = response.species;
						columns = response.columns;
						data = response.data;
						
						break;

				case 'cross':
						//const container = document.getElementById('table-container');
						species = response.species;
						columns = response.regions;
						data = response.data;

						break;
				}
										// ヘッダー作成（1行目：日付 + 品種ごとの colspan、2行目：各地域）
				html = "<table class='table_body'><thead  style='color: #FFFFFF;'><tr>";
				html += '<th rowspan="2">日付</th>';
				species.forEach(spec => {
				html += `<th class="species" colspan="${columns.length}">${spec}</th>`;
				});
				html += '</tr>';

				// 2行目（地域名）
				html += '<tr>';
				species.forEach(() => {
					columns.forEach(col => {
						html += `<th>${col}</th>`;
					});
					});
					html += '</tr>';

					html += '</thead>';

					// ボディ（各日付ごとに1行）
					const dates = Object.keys(data).sort(); // 日付並び替え
					html += '<tbody>';
					dates.forEach(date => {
						html += `<tr><td>${date}</td>`;
						species.forEach(spec => {
							const specObj = data[date] && data[date][spec] ? data[date][spec] : {};
							columns.forEach(col => {
								// 各地域の値（0とかfalsy値）も表示したいからhasOwnPropertyで判定
								const has = Object.prototype.hasOwnProperty.call(specObj, col);
								const val = has ? specObj[col] : '';
								if (val == 0){
									html += `<td>―</td>`;
								}else{
									html += `<td>${val}</td>`;
								}
								
							});
							});
						html += '</tr>';
						});
					html += '</tbody></table>';

				$(".result_table").html(html);
				
			}).fail(function(response){

				$(".result_table").html(response);
			});	
		}
	</script>
